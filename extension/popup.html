<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>ekşi sözlük entry silici</title>
  <style>
    :root {
      --fg: #374151;
      --muted: #9ca3af;
      --accent: #81c14b;
      --danger: #ef4444;
      --bg: #fff;
      --chip: #f3f4f6;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #e5e7eb; --muted: #6b7280; --bg: #1f2937; --chip: #374151; }
    }
    body { margin: 0; width: 300px; font: 13px/1.4 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
    main { padding: 16px; text-align: center; }
    img { height: 48px; }
    h1 { font-size: 14px; font-weight: 600; margin: 4px 0 12px; }
    .status { color: var(--muted); margin-bottom: 8px; }
    .warn { color: var(--danger); }
    details { text-align: left; margin-top: 8px; }
    summary { cursor: pointer; }
    .ids { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; max-height: 120px; overflow-y: auto; margin-top: 6px; }
    .ids a { color: inherit; text-decoration: none; padding: 2px 4px; border-radius: 4px; background: var(--chip); }
    .actions { display: flex; gap: 6px; justify-content: center; margin-top: 8px; flex-wrap: wrap; }
    button { font: inherit; padding: 4px 10px; border: 0; border-radius: 4px; cursor: pointer; background: var(--accent); color: #fff; }
    button.secondary { background: var(--chip); color: var(--fg); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <img src="icons/icon-128.png" alt="">
    <h1>ekşi sözlük entry silici</h1>

    <div id="status" class="status"></div>
    <div id="no-tab" class="warn" hidden>silme işleminin devam etmesi için bir ekşi sözlük sekmesi açık olmalı.</div>

    <details id="queue-section" hidden>
      <summary id="queue-title"></summary>
      <div id="queue" class="ids"></div>
      <div class="actions">
        <button id="pause"></button>
        <button id="clear" class="secondary">listeyi temizle</button>
      </div>
    </details>

    <details id="failed-section" hidden>
      <summary id="failed-title" class="warn"></summary>
      <div id="failed" class="ids"></div>
      <div class="actions">
        <button id="retry">tekrar dene</button>
      </div>
    </details>

    <details id="deleted-section" hidden>
      <summary id="deleted-title"></summary>
      <div id="deleted" class="ids"></div>
    </details>
  </main>
  <script src="popup.js"></script>
</body>
</html>
